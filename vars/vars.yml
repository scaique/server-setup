---
# CONFIGURAÇÕES GERAIS
user_email: "scaique.dev@gmail.com"
node_major: "22"
pnpm_package: "pnpm@latest"

# SITES E APLICAÇÕES
# Tipos disponíveis:
#   - backend: Aplicação Node.js/NestJS com proxy reverso
#   - static: Site estático HTML/React build
#
# Parâmetros:
#   - domain: Domínio completo
#   - type: backend | static
#   - root: Caminho completo do diretório
#   - port: (apenas backend) Porta da aplicação
#   - spa: (apenas static) true para Single Page Application
#   - extra_dirs: (opcional) Diretórios adicionais com permissões

sites:
  # Portfolio principal
  - domain: scaique.dev.br
    type: backend
    root: /var/www/scaique-portfolio
    port: 2000
    
  # Unfollowers Instagram
  - domain: unfollowers.scaique.dev.br
    type: backend
    root: /var/www/unfollowers
    port: 4000
    
  # Site Xeque Mate Studio
  - domain: xequematestudio.com.br
    type: backend
    root: /var/www/xequematestudio
    port: 5000
    
  # Backend Galera das Ondas
  - domain: app.scaique.dev.br
    type: backend
    root: /var/www/galeradasondas-backend
    port: 8000
    extra_dirs:
      - /var/www/galeradasondas-backend/estoque/images
      - /var/www/galeradasondas-backend/vendas/images

# CONFIGURAÇÕES DE SEGURANÇA
# Configurações do Fail2ban
fail2ban_config:
  bantime: 3600        # 1 hora
  findtime: 600        # 10 minutos
  maxretry: 3          # 3 tentativas
  destemail: "scaique.dev@gmail.com"

# Configurações do UFW
ufw_rules:
  - port: 22
    proto: tcp
    rule: allow
  - port: 80
    proto: tcp
    rule: allow
  - port: 443
    proto: tcp
    rule: allow

# CONFIGURAÇÕES DO APACHE
# Módulos necessários do Apache
apache_modules:
  - proxy
  - proxy_http
  - proxy_wstunnel
  - proxy_balancer
  - lbmethod_byrequests
  - rewrite
  - headers
  - ssl
  - expires
  - cache
  - cache_disk
  - deflate

