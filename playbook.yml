---
- name: Provisionamento completo do servidor Ubuntu
  hosts: local
  become: true

  vars:
    node_major: "22"
    pnpm_package: "pnpm@latest"
    security_email: "scaique.dev@gmail.com"

  roles:
    - role: base
    - tag: base
    - role: firewall
    - tag: firewall
    - role: apache
    - tag: apache
    - role: node
    - tag: node
    - role: python
    - tag: python
    - role: pm2
    - tag: pm2
    - role: certbot
    - tag: certbot
    - role: security
    - tag: security
