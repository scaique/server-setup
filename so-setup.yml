---

- name: Provisionamento completo do servidor Ubuntu
  hosts: local
  become: true

  vars_files:
    - vars/vars.yml

  pre_tasks:
    - name: Atualizar cache do APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    # CONFIGURAÇÃO BÁSICA DO SISTEMA
    - role: base
      tags: [base, setup]

    # SEGURANÇA E FIREWALL
    - role: firewall
      tags: [firewall, security, setup]

    - role: security
      tags: [security, setup]

    # SERVIDOR WEB
    - role: apache
      tags: [apache, web, setup]

    - role: certbot
      tags: [certbot, ssl, setup]

    # RUNTIME E GERENCIAMENTO DE PROCESSOS
    - role: node
      tags: [node, runtime, setup]

    - role: pm2
      tags: [pm2, runtime, setup]

    # MONITORAMENTO (OPCIONAL)
    - role: monitoring
      tags: [monitoring, optional]

  post_tasks:
    - name: Reiniciar serviços essenciais
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - apache2
        - fail2ban
      tags: [setup]

    - name: Mostrar status final
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✅ PROVISIONAMENTO CONCLUÍDO COM SUCESSO!"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
          - "📦 Instalado:"
          - "   - Ubuntu 24.04 LTS configurado"
          - "   - Apache {{ apache_version | default('2.4') }} com SSL"
          - "   - Node.js {{ node_major }}"
          - "   - PM2 para gerenciamento de processos"
          - "   - Certbot para SSL automático"
          - "   - UFW Firewall configurado"
          - "   - Fail2ban ativo"
          - "   - Scripts de monitoramento"
          - ""
          - "🔐 Segurança:"
          - "   - Firewall ativo (SSH, HTTP, HTTPS)"
          - "   - Fail2ban protegendo SSH e Apache"
          - "   - Anti-malware instalado (rkhunter, chkrootkit, clamav)"
          - "   - Atualizações automáticas habilitadas"
          - "   - Hardening do sistema aplicado"
          - ""
          - "📝 Próximos passos:"
          - "   1. Execute: ansible-playbook sites-setup.yml"
          - "   2. Configure seus domínios no Cloudflare"
          - "   3. Deploy suas aplicações"
          - ""
          - "💡 Scripts disponíveis:"
          - "   - checkmalware: Verificar processos suspeitos"
          - "   - server-status: Ver status do servidor"
          - "   - check-certs: Verificar certificados SSL"
          - ""
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      tags: [setup]
