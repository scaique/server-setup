---
- name: Verificar configuração do Apache
  command: apache2ctl configtest
  register: config_test
  changed_when: false
  failed_when: "'Syntax OK' not in config_test.stdout"

- name: Garantir que módulos necessários estão habilitados
  apache2_module:
    name: "{{ item }}"
    state: present
    force: true
  loop:
    - proxy
    - proxy_http
    - proxy_wstunnel
    - proxy_balancer
    - lbmethod_byrequests
    - rewrite
    - headers
    - ssl
  notify: restart apache

- name: Criar diretórios dos sites com permissões totais
  file:
    path: "{{ item.root }}"
    state: directory
    mode: '0777'
    recurse: yes
  loop: "{{ sites }}"

- name: Criar diretórios extras quando especificados
  file:
    path: "{{ item.1 }}"
    state: directory
    mode: '0777'
    recurse: yes
  loop: "{{ sites | subelements('extra_dirs', skip_missing=True) }}"

- name: Criar arquivos de configuração para sites estáticos
  template:
    src: static-site.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.domain }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
  when: item.type == 'static'
  notify: reload apache

- name: Criar arquivos de configuração para sites backend
  template:
    src: backend-site.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.domain }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
  when: item.type == 'backend'
  notify: reload apache

- name: Habilitar sites
  command: a2ensite {{ item.domain }}.conf
  args:
    creates: /etc/apache2/sites-enabled/{{ item.domain }}.conf
  loop: "{{ sites }}"
  notify: reload apache