---
# INSTALAÇÃO E CONFIGURAÇÃO DO APACHE

- name: Instalar Apache
  apt:
    name: apache2
    state: present
    update_cache: yes

- name: Habilitar módulos necessários
  apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ apache_modules }}"
  notify: restart apache

# CONFIGURAÇÃO DE SEGURANÇA BÁSICA

- name: Desabilitar tokens do servidor
  lineinfile:
    path: /etc/apache2/conf-enabled/security.conf
    regexp: '^ServerTokens'
    line: 'ServerTokens Prod'
    create: yes
  notify: reload apache

- name: Desabilitar assinatura do servidor
  lineinfile:
    path: /etc/apache2/conf-enabled/security.conf
    regexp: '^ServerSignature'
    line: 'ServerSignature Off'
    create: yes
  notify: reload apache

# CLOUDFLARE - RESTORE REAL IP

- name: Habilitar mod_remoteip para Cloudflare
  apache2_module:
    name: remoteip
    state: present
  notify: restart apache

- name: Criar configuração RemoteIP para Cloudflare
  template:
    src: cloudflare-remoteip.conf.j2
    dest: /etc/apache2/conf-available/cloudflare-remoteip.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload apache

- name: Habilitar configuração do Cloudflare
  command: a2enconf cloudflare-remoteip
  args:
    creates: /etc/apache2/conf-enabled/cloudflare-remoteip.conf
  notify: reload apache

# OTIMIZAÇÕES DE PERFORMANCE

- name: Configurar MPM Event (mais eficiente que prefork)
  copy:
    dest: /etc/apache2/mods-available/mpm_event.conf
    content: |
      <IfModule mpm_event_module>
          StartServers             2
          MinSpareThreads          25
          MaxSpareThreads          75
          ThreadLimit              64
          ThreadsPerChild          25
          MaxRequestWorkers        150
          MaxConnectionsPerChild   0
      </IfModule>
    owner: root
    group: root
    mode: '0644'
  notify: restart apache

# SERVIÇO

- name: Habilitar e iniciar Apache
  systemd:
    name: apache2
    state: started
    enabled: yes
