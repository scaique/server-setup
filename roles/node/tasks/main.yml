---
- name: Remover Node.js antigo
  apt:
    name:
      - nodejs
      - npm
    state: absent
    purge: yes

- name: Criar diretório para keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Baixar e adicionar chave GPG do NodeSource
  shell: |
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Adicionar repositório NodeSource
  copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    content: |
      deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main
    mode: '0644'

- name: Atualizar cache APT
  apt:
    update_cache: yes

- name: Instalar Node.js {{ node_major }}
  apt:
    name: nodejs
    state: present
    update_cache: yes

- name: Verificar instalação
  command: "{{ item }}"
  loop:
    - node --version
    - npm --version
  register: node_check
  changed_when: false

- name: Mostrar versões instaladas
  debug:
    msg: "{{ node_check.results | map(attribute='stdout') | list }}"

- name: Instalar PNPM global
  npm:
    name: "{{ pnpm_package }}"
    global: yes
