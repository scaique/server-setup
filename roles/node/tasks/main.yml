---
- name: Remover versões antigas do Node.js
  apt:
    name:
      - nodejs
      - npm
    state: absent
    purge: yes

- name: Remover repositórios antigos do NodeSource
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /usr/share/keyrings/nodesource.gpg

- name: Baixar script de instalação do NodeSource
  get_url:
    url: "https://deb.nodesource.com/setup_{{ node_major }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: '0755'

- name: Executar script de instalação do NodeSource
  command: bash /tmp/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Atualizar cache do APT
  apt:
    update_cache: yes

- name: Instalar Node.js
  apt:
    name: nodejs
    state: present

- name: Criar link simbólico do npm se não existir
  file:
    src: /usr/bin/npm
    dest: /usr/local/bin/npm
    state: link
  ignore_errors: yes

- name: Verificar se npm existe
  stat:
    path: /usr/bin/npm
  register: npm_bin

- name: Exibir aviso se npm não foi instalado
  debug:
    msg: "AVISO: npm não foi encontrado. Será instalado via nodejs."
  when: not npm_bin.stat.exists

- name: Verificar versões instaladas
  shell: |
    node --version
    npm --version 2>/dev/null || echo "npm não disponível ainda"
  register: versions
  changed_when: false

- name: Exibir versões
  debug:
    msg: "{{ versions.stdout_lines }}"

- name: Instalar PNPM global
  npm:
    name: "{{ pnpm_package }}"
    global: yes
  retries: 3
  delay: 5