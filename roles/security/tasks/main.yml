---
# Fail2ban
- name: Instalar Fail2ban
  apt:
    name: fail2ban
    state: present

- name: Configurar jail.local
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 3
      destemail = {{ user_email }}
      sender = {{ user_email }}
      mta = sendmail

      [sshd]
      enabled = true

      [apache-auth]
      enabled = true

      [apache-noscript]
      enabled = true

- name: Reiniciar Fail2ban
  systemd:
    name: fail2ban
    state: restarted
    enabled: yes


# Anti-malware
- name: Instalar ferramentas anti-malware
  apt:
    name:
      - rkhunter
      - chkrootkit
    state: present

- name: Atualizar rkhunter
  shell: rkhunter --update
  ignore_errors: yes


# Unattended upgrades
- name: Instalar unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present

- name: Habilitar atualizações automáticas
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";


# sysctl hardening seguro
- name: Aplicar hardening sysctl seguro
  copy:
    dest: /etc/sysctl.d/99-hardening.conf
    content: |
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1

- name: Aplicar sysctl
  shell: sysctl -p /etc/sysctl.d/99-hardening.conf
