---
- name: Instalar firewall UFW
  apt:
    name: ufw
    state: present

- name: Permitir SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Permitir HTTP
  ufw:
    rule: allow
    port: '80'

- name: Permitir HTTPS
  ufw:
    rule: allow
    port: '443'

- name: Aplicar rate-limit (proteção leve)
  ufw:
    rule: limit
    port: "{{ item }}"
  loop:
    - 22
    - 80
    - 443

- name: Habilitar UFW
  ufw:
    state: enabled
    policy: deny
