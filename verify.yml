---
- name: Verificação completa do servidor
  hosts: local
  become: true

  vars_files:
    - vars/vars.yml

  tasks:
    - name: Banner inicial
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "VERIFICAÇÃO COMPLETA DO SERVIDOR"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # PACOTES

    - name: Verificar pacotes instalados
      command: "{{ item.cmd }}"
      loop:
        - { cmd: "apache2 -v", name: "apache" }
        - { cmd: "node --version", name: "node" }
        - { cmd: "npm --version", name: "npm" }
        - { cmd: "pnpm --version", name: "pnpm" }
        - { cmd: "pm2 --version", name: "pm2" }
        - { cmd: "git --version", name: "git" }
        - { cmd: "certbot --version", name: "certbot" }
        - { cmd: "ufw --version", name: "ufw" }
        - { cmd: "fail2ban-client --version", name: "fail2ban" }
        - { cmd: "rkhunter --version", name: "rkhunter" }
        - { cmd: "chkrootkit -V", name: "chkrootkit" }
      register: packages
      failed_when: false
      changed_when: false

    # SERVIÇOS

    - name: Verificar Apache
      systemd:
        name: apache2
      register: apache_service

    - name: Verificar Fail2ban
      systemd:
        name: fail2ban
      register: fail2ban_service

    - name: Verificar UFW
      command: ufw status
      register: ufw_status
      changed_when: false

    # MÓDULOS APACHE

    - name: Listar módulos Apache
      command: apache2ctl -M
      register: apache_modules
      changed_when: false

    - name: Verificar módulos críticos
      set_fact:
        missing_modules: []

    - name: Checar cada módulo
      set_fact:
        missing_modules: "{{ missing_modules + [item] }}"
      when: "item + '_module' not in apache_modules.stdout"
      loop:
        - proxy
        - proxy_http
        - proxy_wstunnel
        - rewrite
        - headers
        - ssl
        - remoteip

    # CONFIGURAÇÕES APACHE

    - name: Verificar arquivos de configuração Apache
      stat:
        path: "{{ item }}"
      loop:
        - /etc/apache2/conf-available/cloudflare-remoteip.conf
        - /etc/apache2/conf-enabled/cloudflare-remoteip.conf
        - /etc/apache2/mods-available/mpm_event.conf
        - /etc/apache2/conf-enabled/security.conf
      register: apache_configs

    - name: Testar configuração Apache
      command: apache2ctl configtest
      register: apache_test
      failed_when: false
      changed_when: false

    # SITES

    - name: Verificar vhosts habilitados
      stat:
        path: "/etc/apache2/sites-enabled/{{ item.domain }}.conf"
      loop: "{{ sites }}"
      register: vhosts_enabled

    - name: Verificar vhosts disponíveis
      stat:
        path: "/etc/apache2/sites-available/{{ item.domain }}.conf"
      loop: "{{ sites }}"
      register: vhosts_available

    - name: Verificar diretórios dos sites
      stat:
        path: "{{ item.root }}"
      loop: "{{ sites }}"
      register: site_dirs

    # SSL

    - name: Verificar certificados SSL
      stat:
        path: "/etc/letsencrypt/live/{{ item.domain }}/fullchain.pem"
      loop: "{{ sites }}"
      register: ssl_certs

    - name: Verificar cron renovação SSL
      command: crontab -l
      register: cron_ssl
      failed_when: false
      changed_when: false

    # SCRIPTS MONITORAMENTO

    - name: Verificar scripts
      stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/checkmalware
        - /usr/local/bin/server-status
        - /usr/local/bin/check-certs
      register: scripts

    # SEGURANÇA

    - name: Verificar arquivos de segurança
      stat:
        path: "{{ item }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-hardening.conf
      register: security_files

    - name: Verificar jails Fail2ban
      command: fail2ban-client status
      register: fail2ban_jails
      changed_when: false

    - name: Verificar regras UFW
      command: ufw status numbered
      register: ufw_rules
      changed_when: false

    # FIREWALL

    - name: Verificar portas abertas UFW
      shell: ufw status | grep -E "^(22|80|443)"
      register: ufw_ports
      failed_when: false
      changed_when: false

    # PREPARAR RELATÓRIO

    - name: Resumo pacotes
      set_fact:
        pkg_status:
          apache: "{{ '✅' if packages.results[0].rc == 0 else '❌' }}"
          node: "{{ '✅ ' + packages.results[1].stdout.strip() if packages.results[1].rc == 0 else '❌' }}"
          npm: "{{ '✅ ' + packages.results[2].stdout.strip() if packages.results[2].rc == 0 else '❌' }}"
          pnpm: "{{ '✅ ' + packages.results[3].stdout.strip() if packages.results[3].rc == 0 else '❌' }}"
          pm2: "{{ '✅ ' + packages.results[4].stdout.strip() if packages.results[4].rc == 0 else '❌' }}"
          git: "{{ '✅' if packages.results[5].rc == 0 else '❌' }}"
          certbot: "{{ '✅' if packages.results[6].rc == 0 else '❌' }}"
          ufw: "{{ '✅' if packages.results[7].rc == 0 else '❌' }}"
          fail2ban: "{{ '✅' if packages.results[8].rc == 0 else '❌' }}"
          rkhunter: "{{ '✅' if packages.results[9].rc == 0 else '❌' }}"
          chkrootkit: "{{ '✅' if packages.results[10].rc == 0 else '❌' }}"

    - name: Resumo serviços
      set_fact:
        svc_status:
          apache: "{{ '✅ Rodando' if apache_service.status.ActiveState == 'active' else '❌ Parado' }}"
          fail2ban: "{{ '✅ Rodando' if fail2ban_service.status.ActiveState == 'active' else '❌ Parado' }}"
          ufw: "{{ '✅ Ativo' if 'Status: active' in ufw_status.stdout else '❌ Inativo' }}"

    - name: Resumo Apache
      set_fact:
        apache_summary:
          config_valid: "{{ apache_test.rc == 0 }}"
          modules_ok: "{{ missing_modules | length == 0 }}"
          cloudflare_exists: "{{ apache_configs.results[0].stat.exists }}"
          cloudflare_enabled: "{{ apache_configs.results[1].stat.exists }}"
          mpm_event: "{{ apache_configs.results[2].stat.exists }}"
          security_conf: "{{ apache_configs.results[3].stat.exists }}"

    - name: Resumo sites
      set_fact:
        sites_summary:
          total: "{{ sites | length }}"
          vhosts_available: "{{ vhosts_available.results | selectattr('stat.exists') | list | length }}"
          vhosts_enabled: "{{ vhosts_enabled.results | selectattr('stat.exists') | list | length }}"
          dirs_created: "{{ site_dirs.results | selectattr('stat.exists') | list | length }}"
          with_ssl: "{{ ssl_certs.results | selectattr('stat.exists') | list | length }}"

    - name: Resumo segurança
      set_fact:
        security_summary:
          fail2ban_jail: "{{ security_files.results[0].stat.exists }}"
          sysctl_hardening: "{{ security_files.results[1].stat.exists }}"
          scripts_ok: "{{ scripts.results | selectattr('stat.exists') | list | length }}"

    # RELATÓRIO FINAL

    - name: Exibir relatório
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "RELATÓRIO DE VERIFICAÇÃO"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
          - "PACOTES:"
          - "   Apache: {{ pkg_status.apache }}"
          - "   Node.js: {{ pkg_status.node }}"
          - "   NPM: {{ pkg_status.npm }}"
          - "   PNPM: {{ pkg_status.pnpm }}"
          - "   PM2: {{ pkg_status.pm2 }}"
          - "   Git: {{ pkg_status.git }}"
          - "   Certbot: {{ pkg_status.certbot }}"
          - "   UFW: {{ pkg_status.ufw }}"
          - "   Fail2ban: {{ pkg_status.fail2ban }}"
          - "   rkhunter: {{ pkg_status.rkhunter }}"
          - "   chkrootkit: {{ pkg_status.chkrootkit }}"
          - ""
          - "SERVIÇOS:"
          - "   Apache: {{ svc_status.apache }}"
          - "   Fail2ban: {{ svc_status.fail2ban }}"
          - "   UFW: {{ svc_status.ufw }}"
          - ""
          - "APACHE:"
          - "   Configuração: {{ '✅ Válida' if apache_summary.config_valid else '❌ Inválida' }}"
          - "   Módulos: {{ '✅ OK' if apache_summary.modules_ok else '❌ Faltando: ' + (missing_modules | join(', ')) }}"
          - "   MPM Event: {{ '✅' if apache_summary.mpm_event else '❌' }}"
          - "   Security.conf: {{ '✅' if apache_summary.security_conf else '❌' }}"
          - ""
          - "CLOUDFLARE:"
          - "   Config existe: {{ '✅' if apache_summary.cloudflare_exists else '❌' }}"
          - "   Config habilitada: {{ '✅' if apache_summary.cloudflare_enabled else '❌' }}"
          - ""
          - "SITES:"
          - "   Total: {{ sites_summary.total }}"
          - "   VHosts disponíveis: {{ sites_summary.vhosts_available }}/{{ sites_summary.total }}"
          - "   VHosts habilitados: {{ sites_summary.vhosts_enabled }}/{{ sites_summary.total }}"
          - "   Diretórios criados: {{ sites_summary.dirs_created }}/{{ sites_summary.total }}"
          - "   Com SSL: {{ sites_summary.with_ssl }}/{{ sites_summary.total }}"
          - "   Renovação SSL: {{ '✅' if 'certbot renew' in cron_ssl.stdout else '❌' }}"
          - ""
          - "SEGURANÇA:"
          - "   Fail2ban jail.local: {{ '✅' if security_summary.fail2ban_jail else '❌' }}"
          - "   Sysctl hardening: {{ '✅' if security_summary.sysctl_hardening else '❌' }}"
          - "   Scripts monitoramento: {{ security_summary.scripts_ok }}/3"
          - "   Jails ativos: {{ fail2ban_jails.stdout }}"
          - ""
          - "FIREWALL:"
          - "   Portas 22,80,443: {{ '✅' if ufw_ports.rc == 0 else '❌' }}"
          - "   Total regras: {{ ufw_rules.stdout_lines | length - 5 }}"
          - ""
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # PROBLEMAS CRÍTICOS

    - name: Verificar problemas
      set_fact:
        issues: []

    - name: Check Apache
      set_fact:
        issues: "{{ issues + ['Apache não rodando'] }}"
      when: apache_service.status.ActiveState != 'active'

    - name: Check Cloudflare
      set_fact:
        issues: "{{ issues + ['Cloudflare não habilitado'] }}"
      when: not apache_summary.cloudflare_enabled

    - name: Check Sites
      set_fact:
        issues: "{{ issues + [sites_summary.vhosts_enabled|string + '/' + sites_summary.total|string + ' sites habilitados'] }}"
      when: sites_summary.vhosts_enabled | int < sites_summary.total | int

    - name: Check SSL
      set_fact:
        issues: "{{ issues + ['SSL faltando em ' + ((sites_summary.total|int - sites_summary.with_ssl|int)|string) + ' site(s)'] }}"
      when: sites_summary.with_ssl | int < sites_summary.total | int

    - name: Check Fail2ban
      set_fact:
        issues: "{{ issues + ['Fail2ban não rodando'] }}"
      when: fail2ban_service.status.ActiveState != 'active'

    - name: Check UFW
      set_fact:
        issues: "{{ issues + ['UFW não ativo'] }}"
      when: "'Status: active' not in ufw_status.stdout"

    - name: Mostrar problemas
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "⚠️  PROBLEMAS ENCONTRADOS:"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "{{ issues | join('\n') }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      when: issues | length > 0

    - name: Sucesso
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✅ TUDO CONFIGURADO CORRETAMENTE!"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      when: issues | length == 0

    - name: Falhar se houver problemas
      fail:
        msg: "{{ issues | length }} problema(s) encontrado(s)"
      when: issues | length > 0