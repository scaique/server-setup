---

- name: Configuração de Sites e SSL
  hosts: local
  become: true

  vars_files:
    - vars/vars.yml

  pre_tasks:
    - name: Verificar se Apache está instalado
      command: apache2 -v
      register: apache_check
      failed_when: false
      changed_when: false

    - name: Falhar se Apache não estiver instalado
      fail:
        msg: "Apache não está instalado. Execute primeiro: ansible-playbook so-setup.yml"
      when: apache_check.rc != 0

    - name: Filtrar sites se single_site foi especificado
      set_fact:
        filtered_sites: "{{ sites | selectattr('domain', 'equalto', single_site) | list }}"
      when: single_site is defined

    - name: Usar todos os sites se single_site não foi especificado
      set_fact:
        filtered_sites: "{{ sites }}"
      when: single_site is not defined

    - name: Mostrar sites que serão configurados
      debug:
        msg:
          - "Sites que serão configurados:"
          - "{{ filtered_sites | map(attribute='domain') | list }}"

  roles:
    # CONFIGURAÇÃO DE VIRTUAL HOSTS
    - role: vhosts
      vars:
        sites: "{{ filtered_sites }}"
      tags: [vhosts, sites]

    # CERTIFICADOS SSL
    - role: ssl
      vars:
        sites: "{{ filtered_sites }}"
      tags: [ssl, sites]

  post_tasks:
    - name: Verificar configuração do Apache
      command: apache2ctl configtest
      register: configtest
      changed_when: false
      failed_when: configtest.rc != 0

    - name: Recarregar Apache
      systemd:
        name: apache2
        state: reloaded
      tags: [sites]

    - name: Testar conectividade dos sites
      uri:
        url: "https://{{ item.domain }}"
        validate_certs: no
        timeout: 10
      loop: "{{ filtered_sites }}"
      register: site_tests
      failed_when: false
      changed_when: false
      tags: [test]

    - name: Preparar lista de sites configurados
      set_fact:
        sites_list: "{{ filtered_sites | map(attribute='domain') | list }}"
      tags: [sites]

    - name: Preparar resultados dos testes
      set_fact:
        test_results: "{{ site_tests.results | map('dict2items') | list }}"
      when: site_tests is defined
      tags: [sites]

    - name: Mostrar resultado dos testes
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✅ CONFIGURAÇÃO DE SITES CONCLUÍDA!"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - ""
          - "📋 Sites configurados: {{ filtered_sites | length }}"
          - "{{ sites_list | join(', ') }}"
          - ""
          - "🔐 SSL:"
          - "   - Certificados obtidos e instalados"
          - "   - Renovação automática configurada (cron)"
          - "   - HTTPS redirect habilitado"
          - ""
          - "🌐 Cloudflare:"
          - "   - RemoteIP configurado"
          - "   - Logs mostram IP real dos visitantes"
          - ""
          - "💡 Comandos úteis:"
          - "   - check-certs: Ver certificados SSL"
          - "   - server-status: Ver status geral"
          - "   - apache2ctl configtest: Testar config"
          - ""
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      tags: [sites]
